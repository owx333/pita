<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二单元：风险管理与保险规划 — 自我评估题库</title>
<style>
  :root{
    --ink:#1c2321;
    --ink-soft:#4a5450;
    --paper:#faf7f0;
    --paper-raised:#ffffff;
    --line:#ddd6c4;
    --brass:#8a6d3b;
    --brass-deep:#6b5228;
    --seal:#7c2d2d;
    --pine:#3f5d4e;
    --pine-deep:#2e4437;
    --gold-bg:#f4ecd8;
    --wrong:#a13d3d;
    --wrong-bg:#f9e6e6;
    --right:#2e6b4f;
    --right-bg:#e6f2ea;
    --shadow: 0 1px 2px rgba(28,35,33,0.06), 0 8px 24px rgba(28,35,33,0.08);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #fff7e6 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #eef3ea 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family: "Noto Serif SC","Songti SC","SimSun","PMingLiU", "Georgia", serif;
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 18px 80px;
  }
  header.masthead{
    text-align:center;
    padding:22px 10px 26px;
    border-bottom:3px double var(--brass);
    margin-bottom:26px;
    position:relative;
  }
  header.masthead .eyebrow{
    font-family:"Helvetica Neue",Arial,sans-serif;
    letter-spacing:0.28em;
    font-size:11px;
    color:var(--brass-deep);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  header.masthead h1{
    font-size:28px;
    margin:0 0 6px;
    font-weight:700;
    color:var(--ink);
  }
  header.masthead .sub{
    font-size:14px;
    color:var(--ink-soft);
    font-family:"Helvetica Neue",Arial,sans-serif;
  }

  /* ---------- Home / lesson picker ---------- */
  .grid-lessons{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  .lesson-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .lesson-card:hover{ transform: translateY(-2px); border-color:var(--brass); }
  .lesson-card .num{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:800;
    font-size:13px;
    color:var(--brass-deep);
    background:var(--gold-bg);
    border:1px solid var(--brass);
    border-radius:999px;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .lesson-card .title{
    flex:1;
    font-size:16px;
    color:var(--ink);
  }
  .lesson-card .meta{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .lesson-card .badge{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.done{ background:var(--right-bg); color:var(--right); border:1px solid #bfe0cd;}

  .all-btn{
    margin:22px 0 6px;
    display:block;
    width:100%;
    text-align:center;
    background:var(--pine);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    padding:16px;
    font-size:16px;
    font-weight:700;
    font-family:"Helvetica Neue",Arial,sans-serif;
    letter-spacing:0.02em;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .15s ease, transform .15s ease;
  }
  .all-btn:hover{ background:var(--pine-deep); transform:translateY(-1px);}
  .all-btn .sm{ display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:3px;}

  .section-label{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:26px 0 10px 2px;
  }

  /* ---------- Quiz screen ---------- */
  .quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    gap:10px;
  }
  .back-btn{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--brass); color:var(--brass-deep); }
  .lesson-tag{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:var(--brass-deep);
    font-weight:700;
    text-align:right;
  }
  .progress-track{
    height:6px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--brass), var(--pine));
    border-radius:999px;
    transition:width .3s ease;
  }

  .qcard{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px 22px;
    box-shadow:var(--shadow);
  }
  .qnum{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.1em;
    margin-bottom:10px;
  }
  .qtext{
    font-size:18px;
    color:var(--ink);
    white-space:pre-line;
    margin-bottom:20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 15px;
    border:1.5px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    background:#fffdf9;
    transition: border-color .12s ease, background .12s ease;
    font-size:15.5px;
  }
  .opt:hover{ border-color:var(--brass); background:var(--gold-bg); }
  .opt .letter{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:800;
    font-size:13px;
    color:var(--brass-deep);
    background:var(--gold-bg);
    border:1px solid var(--brass);
    border-radius:50%;
    width:26px;height:26px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .opt.selected{ border-color:var(--brass); background:var(--gold-bg); }
  .opt.correct{ border-color:var(--right); background:var(--right-bg); }
  .opt.correct .letter{ background:var(--right); color:#fff; border-color:var(--right);}
  .opt.wrong{ border-color:var(--wrong); background:var(--wrong-bg); }
  .opt.wrong .letter{ background:var(--wrong); color:#fff; border-color:var(--wrong);}
  .opt.disabled{ cursor:default; }
  .opt.disabled:hover{ background:inherit; }

  .result-line{
    margin-top:16px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    font-weight:700;
    display:none;
    align-items:center;
    gap:8px;
  }
  .result-line.show{ display:flex; }
  .result-line.ok{ color:var(--right); }
  .result-line.bad{ color:var(--wrong); }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .score-pill{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    color:var(--ink-soft);
  }
  .next-btn{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:14px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:11px 24px;
    cursor:pointer;
    opacity:.35;
    pointer-events:none;
    transition:opacity .15s ease, background .15s ease;
  }
  .next-btn.active{ opacity:1; pointer-events:auto; background:var(--seal); }
  .next-btn.active:hover{ background:#5c2222; }

  /* ---------- Results screen ---------- */
  .results-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px 26px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .results-card .score-big{
    font-size:56px;
    font-weight:800;
    color:var(--seal);
    line-height:1;
    margin:6px 0 4px;
  }
  .results-card .score-frac{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .results-card .remark{
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:22px;
  }
  .btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn-row button{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:13.5px;
    border-radius:999px;
    padding:11px 20px;
    cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .btn-row button.primary{
    background:var(--pine);
    border-color:var(--pine);
    color:#fff;
  }
  .btn-row button.primary:hover{ background:var(--pine-deep); }
  .btn-row button:hover{ border-color:var(--brass); }

  .review-list{
    margin-top:26px;
    text-align:left;
  }
  .review-item{
    border-top:1px solid var(--line);
    padding:14px 2px;
    font-size:14.5px;
  }
  .review-item .rq{ white-space:pre-line; margin-bottom:8px; color:var(--ink);}
  .review-item .ra{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; }
  .review-item .ra .yours{ color:var(--wrong); font-weight:700;}
  .review-item .ra .correct{ color:var(--right); font-weight:700;}
  .tag-lesson{
    display:inline-block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;
    color:var(--brass-deep);
    background:var(--gold-bg);
    border:1px solid var(--brass);
    border-radius:999px;
    padding:2px 8px;
    margin-bottom:6px;
  }

  .hidden{ display:none !important; }

  footer.note{
    text-align:center;
    margin-top:40px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11.5px;
    color:#9a9384;
  }

  @media (max-width:480px){
    .qcard{ padding:20px 16px 18px; }
    .qtext{ font-size:16.5px; }
    header.masthead h1{ font-size:23px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="eyebrow">MFPC · RFP Module 2</div>
    <h1>第二单元：风险管理与保险规划</h1>
    <div class="sub">自我评估题库 · 400 题综合版</div>
  </header>

  <!-- ============ HOME SCREEN ============ -->
  <div id="screen-home">
    <button class="all-btn" id="btn-all">
      开始全书综合测验（400 题，随机顺序）
      <span class="sm">一次完成 400 题综合模拟，全面检验掌握程度</span>
    </button>

    <div class="section-label">分套测验</div>
    <div class="grid-lessons" id="lesson-list"></div>
  </div>

  <!-- ============ QUIZ SCREEN ============ -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-header">
      <button class="back-btn" id="btn-back">← 返回目录</button>
      <div class="lesson-tag" id="quiz-lesson-tag"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="qcard">
      <div class="qnum" id="qnum"></div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="options"></div>
      <div class="result-line" id="result-line"></div>
      <div class="nav-row">
        <div class="score-pill" id="score-pill"></div>
        <button class="next-btn" id="btn-next">下一题 →</button>
      </div>
    </div>
  </div>

  <!-- ============ RESULTS SCREEN ============ -->
  <div id="screen-results" class="hidden">
    <div class="results-card">
      <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;" id="results-lesson-tag">测验完成</div>
      <div class="score-big" id="score-percent">0%</div>
      <div class="score-frac" id="score-frac"></div>
      <div class="remark" id="score-remark"></div>
      <div class="btn-row">
        <button class="primary" id="btn-retry">重新测验</button>
        <button id="btn-home">返回目录</button>
      </div>
      <div class="review-list" id="review-list"></div>
    </div>
  </div>

  <footer class="note">内容整理自《第二单元：风险管理与保险规划》模拟题库（400题） · 仅供个人复习自测使用</footer>
</div>

<script>
const LESSONS = [{"id": 1, "title": "400题综合模拟测验", "questions": [{"q": "某客户在风险沟通中提到：\n暴露于不确定并可能造成财务损失的状态。\n这最符合哪个术语？", "options": ["风险控制（Risk Control）", "需求分析法（Needs Analysis）", "风险（Risk）", "可保利益（Insurable Interest）"], "answer": 2}, {"q": "关于「风险（Risk）」，下列哪项描述最准确？", "options": ["投保与承保双方都必须充分、诚实披露重大事实。", "暴露于不确定并可能造成财务损失的状态。", "承保现金在场所内或运送途中被抢劫盗窃等损失。", "消费者有权获得清晰、完整、可理解的产品信息。"], "answer": 1}, {"q": "围绕「风险（Risk）」这个概念，下列哪一组“术语—解释”配对正确？", "options": ["风险诱因（Hazard） — 生存至期满或在期内身故都可领取给付。", "风险（Risk） — 暴露于不确定并可能造成财务损失的状态。", "Mudharabah 模式 — 伊斯兰金融中被禁止的赌博成分。", "实际现金价值（Actual Cash Value） — 以具体财务责任计算保障缺口的保险需求方法。"], "answer": 1}, {"q": "若以「风险（Risk）」为参照，下列哪一组“术语—解释”配对错误？", "options": ["失效抚恤金计划（Invalidity Pension Scheme） — SOCSO 对失去工作能力成员提供长期收入保障。", "Al-Maisir — 伊斯兰金融中被禁止的赌博成分。", "损失预防（Loss Prevention） — 降低损失发生的可能性。", "风险（Risk） — 无法从事原本职业即符合残疾给付条件，定义较宽。"], "answer": 3}, {"q": "情境：客户提供了这条关键线索：\n暴露于不确定并可能造成财务损失的状态。\n你最可能采用哪个术语进行归纳？", "options": ["失效抚恤金计划（Invalidity Pension Scheme）", "风险（Risk）", "风险转移（Risk Transfer）", "给付/清算期（Liquidation Phase）"], "answer": 1}, {"q": "你要向新进顾问说明「风险（Risk）」，下列哪项讲法最准确？", "options": ["暴露于不确定并可能造成财务损失的状态。", "生存至期满或在期内身故都可领取给付。", "采取措施降低损失发生频率或严重程度。", "估算家庭因经济支柱身故而损失的收入现值。"], "answer": 0}, {"q": "以下关于「风险（Risk）」的叙述，哪一项错误？", "options": ["风险（Risk）是指：投保人对被保险人生命或财产具有合法经济利益关系。", "区分风险（Risk）时，应抓住定义中的关键字。", "风险（Risk）是指：暴露于不确定并可能造成财务损失的状态。", "在考试题中，风险（Risk）常用于判断风险或保障处理逻辑。"], "answer": 0}, {"q": "当你以「风险（Risk）」作为分析核心时，下列哪组“术语—解释”最可采纳？", "options": ["关键人物价值（Key-man Value） — 暴露于不确定并可能造成财务损失的状态。", "风险（Risk） — 把损失财务后果转移给第三方，例如保险公司。", "风险（Risk） — 暴露于不确定并可能造成财务损失的状态。", "风险规避（Risk Avoidance） — 企业因关键员工离职或身故可能承担的经济损失价值。"], "answer": 2}, {"q": "根据以下描述，最贴切的术语是：\n导致损失发生的直接原因，例如火灾、车祸、疾病。", "options": ["危险因素（Peril）", "任何职业定义（Any Occupation）", "现金/金钱保险（Money Insurance）", "Al-Maisir"], "answer": 0}, {"q": "若要向客户解释「危险因素（Peril）」，哪项定义是正确的？", "options": ["由环境或实物条件造成的危险诱因，如电线老化。", "导致损失发生的直接原因，例如火灾、车祸、疾病。", "确诊合约列明疾病时一次性给付保险金。", "暴露于不确定并可能造成财务损失的状态。"], "answer": 1}, {"q": "关于「危险因素（Peril）」及相 let currentQuestions = [];   // active quiz question list (with lessonTitle attached)
let currentIndex = 0;
let currentScore = 0;
let userAnswers = [];        // {selected, correct, question}
let answeredThisQ = false;
let quizTitle = "";

const screenHome = document.getElementById('screen-home');
const screenQuiz = document.getElementById('screen-quiz');
const screenResults = document.getElementById('screen-results');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ---------- Build home screen lesson cards ----------
function renderHome(){
  const list = document.getElementById('lesson-list');
  list.innerHTML = '';
  LESSONS.forEach(lesson=>{
    const card = document.createElement('div');
    card.className = 'lesson-card';
    card.innerHTML = `
      <div class="num">${lesson.id}</div>
      <div class="title">${lesson.title}</div>
      <div class="meta">${lesson.questions.length} 题</div>
    `;
    card.addEventListener('click', ()=> startLessonQuiz(lesson));
    list.appendChild(card);
  });
}

function startLessonQuiz(lesson){
  currentQuestions = lesson.questions.map(q=>({...q, lessonTitle: lesson.title}));
  quizTitle = lesson.title;
  beginQuiz();
}

function startAllQuiz(){
  let all = [];
  LESSONS.forEach(lesson=>{
    lesson.questions.forEach(q=> all.push({...q, lessonTitle: lesson.title}));
  });
  currentQuestions = shuffle(all);
  quizTitle = "全书综合测验";
  beginQuiz();
}

function beginQuiz(){
  currentIndex = 0;
  currentScore = 0;
  userAnswers = [];
  screenHome.classList.add('hidden');
  screenResults.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  document.getElementById('quiz-lesson-tag').textContent = quizTitle;
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(){
  answeredThisQ = false;
  const total = currentQuestions.length;
  const q = currentQuestions[currentIndex];
  document.getElementById('progress-fill').style.width = ((currentIndex)/total*100)+'%';
  document.getElementById('qnum').textContent = `第 ${currentIndex+1} / ${total} 题　·　${q.lessonTitle}`;
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('score-pill').textContent = `当前得分：${currentScore} / ${currentIndex}`;

  const optWrap = document.getElementById('options');
  optWrap.innerHTML = '';
  const letters = ['A','B','C','D','E','F'];
  q.options.forEach((optText, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<div class="letter">${letters[idx]}</div><div class="otext">${optText}</div>`;
    div.addEventListener('click', ()=> selectOption(idx));
    optWrap.appendChild(div);
  });

  const rl = document.getElementById('result-line');
  rl.className = 'result-line';
  rl.textContent = '';

  const nextBtn = document.getElementById('btn-next');
  nextBtn.classList.remove('active');
  nextBtn.textContent = (currentIndex === total-1) ? '查看结果 →' : '下一题 →';
}

function selectOption(idx){
  if(answeredThisQ) return;
  answeredThisQ = true;
  const q = currentQuestions[currentIndex];
  const isCorrect = idx === q.answer;
  if(isCorrect) currentScore++;

  userAnswers.push({
    question: q.q,
    lessonTitle: q.lessonTitle,
    options: q.options,
    selected: idx,
    correctIdx: q.answer,
    isCorrect: isCorrect
  });

  const opts = document.querySelectorAll('#options .opt');
  opts.forEach((el,i)=>{
    el.classList.add('disabled');
    if(i === q.answer) el.classList.add('correct');
    if(i === idx && idx !== q.answer) el.classList.add('wrong');
    if(i === idx) el.classList.add('selected');
  });

  const rl = document.getElementById('result-line');
  rl.classList.add('show');
  if(isCorrect){
    rl.classList.add('ok');
    rl.textContent = '✓ 答对了';
  } else {
    rl.classList.add('bad');
    rl.textContent = `✗ 答错了 — 正确答案是 ${['A','B','C','D'][q.answer]}`;
  }

  document.getElementById('score-pill').textContent = `当前得分：${currentScore} / ${currentIndex+1}`;
  document.getElementById('btn-next').classList.add('active');
}

document.getElementById('btn-next').addEventListener('click', ()=>{
  if(!answeredThisQ) return;
  if(currentIndex < currentQuestions.length - 1){
    currentIndex++;
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    showResults();
  }
});

document.getElementById('btn-back').addEventListener('click', ()=>{
  screenQuiz.classList.add('hidden');
  screenHome.classList.remove('hidden');
});

document.getElementById('btn-all').addEventListener('click', startAllQuiz);

function showResults(){
  screenQuiz.classList.add('hidden');
  screenResults.classList.remove('hidden');
  const total = currentQuestions.length;
  const pct = Math.round((currentScore/total)*100);
  document.getElementById('results-lesson-tag').textContent = quizTitle + ' · 测验完成';
  document.getElementById('score-percent').textContent = pct + '%';
  document.getElementById('score-frac').textContent = `答对 ${currentScore} / ${total} 题`;

  let remark;
  if(pct === 100) remark = '满分！对这部分内容掌握得非常扎实。';
  else if(pct >= 80) remark = '掌握程度良好，再复习错题即可。';
  else if(pct >= 60) remark = '基础尚可，建议重新阅读相关章节后再测一次。';
  else remark = '这部分需要多花时间复习，建议重新阅读课文后再测验。';
  document.getElementById('score-remark').textContent = remark;

  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '';
  const wrongOnes = userAnswers.filter(a=>!a.isCorrect);
  if(wrongOnes.length > 0){
    const heading = document.createElement('div');
    heading.style.fontFamily = "'Helvetica Neue',Arial,sans-serif";
    heading.style.fontSize = '12px';
    heading.style.letterSpacing = '.18em';
    heading.style.textTransform = 'uppercase';
    heading.style.color = 'var(--ink-soft)';
    heading.style.margin = '10px 2px 4px';
    heading.textContent = `错题回顾（${wrongOnes.length} 题）`;
    reviewList.appendChild(heading);

    wrongOnes.forEach(a=>{
      const div = document.createElement('div');
      div.className = 'review-item';
      const letters = ['A','B','C','D'];
      div.innerHTML = `
        <span class="tag-lesson">${a.lessonTitle}</span>
        <div class="rq">${a.question}</div>
        <div class="ra">
          你的答案：<span class="yours">${letters[a.selected]}. ${a.options[a.selected]}</span><br>
          正确答案：<span class="correct">${letters[a.correctIdx]}. ${a.options[a.correctIdx]}</span>
        </div>
      `;
      reviewList.appendChild(div);
    });
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('btn-retry').addEventListener('click', ()=>{
  // retry same set (re-shuffle if it was the "all" quiz)
  if(quizTitle === "全书综合测验"){
    startAllQuiz();
  } else {
    beginQuiz();
  }
});

document.getElementById('btn-home').addEventListener('click', ()=>{
  screenResults.classList.add('hidden');
  screenHome.classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
});

renderHome();
</script>
</body>
</html>
